[package]
name = "sorahost-tor-proxy"
version = "0.1.0"
edition = "2021"
description = "A dependency-free Tor client exposing a SOCKS5 listener"

# No external crates on purpose: the whole point of this build is to fit a
# `cargo build --release` into a ~200MB cgroup. Cryptography and TLS come from
# the system OpenSSL 3 via hand-written FFI (see src/ffi/).
[dependencies]

# Debug info is the single biggest driver of rustc's peak RSS for this crate.
[profile.release]
debug = 0

[profile.dev]
debug = 0
